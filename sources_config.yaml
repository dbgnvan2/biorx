publication_sources:
  europepmc:
    enabled: true
    default_selected: true

  pubmed:
    enabled: true
    default_selected: true

  psyarxiv:
    enabled: true
    default_selected: true

  socarxiv:
    enabled: true
    default_selected: true

  biorxiv_medrxiv:
    enabled: true
    default_selected: false
    # Its API cannot search words: it lists every paper in the date range (30
    # per request per server) and the filter is applied here, so Max results
    # counts matches. This bounds how much is read: a page is one request of
    # 30 papers to each server still in range, so the larger server sets the
    # count. Two weeks of bioRxiv is about 3,400 papers (~115 pages; about 165
    # requests with medRxiv; measured 2026-09-29: 4,927 papers read in about
    # 3 minutes). 150 covers about 2.5 weeks; a longer range is cut off here
    # and the search says so.
    max_pages: 150

  arxiv:
    enabled: true
    default_selected: false

  openalex:
    enabled: false
    default_selected: false

  crossref:
    enabled: true

  unpaywall:
    enabled: true

  pmc_oa:
    enabled: false

# Your contact email for API polite pools and Unpaywall (required for
# open-access lookup). The environment variable BIORX_CONTACT_EMAIL wins over
# this field when both are set.
#
# Setting BIORX_CONTACT_EMAIL covers all polite-pool consumers (Crossref, arXiv,
# Europe PMC, PubMed, PsyArXiv, SocArXiv, bioRxiv/medRxiv, OpenAlex). It wins
# over this field when both are set; all consumers also read this field directly.
contact_email: ""

# Finding a free full-text copy before summarizing (docs/implementation_plan_2026-09-19_full_text.md).
# Order: the paper's own link, Unpaywall (needs a contact email), OpenAlex,
# Semantic Scholar. With no full text found, the abstract is kept as the entry
# and the model is not called.
full_text:
  # Also search OpenAlex / Semantic Scholar by title when a DOI finds nothing.
  # Title hits must match exactly plus first author or year. Users can turn it
  # off for themselves in Settings.
  find_by_title: true
  # PDFs fetched per paper at most (each can take up to 30 s).
  max_downloads: 4
  # Reading one PDF (review B9): it is untrusted, so it is read in a separate
  # process that stops after this many pages or seconds, and (on Linux) may
  # use at most this much memory.
  max_pages: 40
  extract_timeout_seconds: 60
  extract_memory_mb: 1024
  # A publisher page is read up to this many characters when looking for an
  # abstract (review B8). A longer page is cut, and the cut is logged.
  scrape_max_chars: 512000

# OSF preprint servers (PsyArXiv, SocArXiv) are asked for each title term
# separately when every OR group of a filter has one. Above this many distinct
# terms they are searched by date only and the filter is applied here.
osf:
  max_title_terms: 8

# What the web app tells users when a source fails during a search, by the
# failure kind the orchestrator reports. Wording only — edit freely.
failure_explanations:
  unavailable: "did not respond properly — the service may be down or blocking requests; try again later or untick it in Settings"
  error: "failed with an unexpected error (details are in the server log)"
  rate-limited: "is limiting how fast it can be searched; results from it are incomplete — try again in a few minutes"
  partial: "stopped responding part-way; results from it are incomplete"
  truncated: "had more results than Max results allows; only the first ones were read — raise Max results or narrow the filter"
  page-limit: "has more papers in this date range than one search reads (its page limit), so later papers were not checked — use a shorter date range"
