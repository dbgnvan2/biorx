publication_sources:
  europepmc:
    enabled: true
    default_selected: true

  pubmed:
    enabled: true
    default_selected: true

  psyarxiv:
    enabled: true
    default_selected: true

  socarxiv:
    enabled: true
    default_selected: true

  biorxiv_medrxiv:
    enabled: true
    default_selected: false

  arxiv:
    enabled: true
    default_selected: false

  openalex:
    enabled: false
    default_selected: false

  crossref:
    enabled: true

  unpaywall:
    enabled: true

  pmc_oa:
    enabled: false

# Your contact email for API polite pools and Unpaywall (required for
# open-access lookup). The environment variable BIORX_CONTACT_EMAIL wins over
# this field when both are set.
#
# Setting BIORX_CONTACT_EMAIL covers all polite-pool consumers (Crossref, arXiv,
# Europe PMC, PubMed, PsyArXiv, SocArXiv, bioRxiv/medRxiv, OpenAlex). It wins
# over this field when both are set; all consumers also read this field directly.
contact_email: ""

# Finding a free full-text copy before summarizing (docs/implementation_plan_2026-09-19_full_text.md).
# Order: the paper's own link, Unpaywall (needs a contact email), OpenAlex,
# Semantic Scholar. With no full text found, the abstract is kept as the entry
# and the model is not called.
full_text:
  # Also search OpenAlex / Semantic Scholar by title when a DOI finds nothing.
  # Title hits must match exactly plus first author or year. Users can turn it
  # off for themselves in Settings.
  find_by_title: true
  # PDFs fetched per paper at most (each can take up to 30 s).
  max_downloads: 4

# What the web app tells users when a source fails during a search, by the
# failure kind the orchestrator reports. Wording only — edit freely.
failure_explanations:
  unavailable: "did not respond properly — the service may be down or blocking requests; try again later or untick it in Settings"
  error: "failed with an unexpected error (details are in the server log)"
  rate-limited: "is limiting how fast it can be searched; results from it are incomplete — try again in a few minutes"
  partial: "stopped responding part-way; results from it are incomplete"
