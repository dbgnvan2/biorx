publication_sources:
  europepmc:
    enabled: true
    default_selected: true

  pubmed:
    enabled: true
    default_selected: true

  psyarxiv:
    enabled: true
    default_selected: true

  socarxiv:
    enabled: true
    default_selected: true

  biorxiv_medrxiv:
    enabled: true
    default_selected: false
    # Its API cannot search words: it lists every paper in the date range (30
    # per request per server) and the filter is applied here, so Max results
    # counts matches. This bounds how much is read: a page is one request of
    # 30 papers to each server still in range, so the larger server sets the
    # count. Two weeks of bioRxiv is about 3,400 papers (~115 pages; about 165
    # requests with medRxiv; measured 2026-09-29: 4,927 papers read in about
    # 3 minutes). 150 covers about 2.5 weeks; a longer range is cut off here
    # and the search says so.
    max_pages: 150
    # Read directly only where it adds something (BW,
    # docs/implementation_plan_2026-10-07_biorxiv_window.md). Europe PMC
    # indexes bioRxiv and medRxiv preprints with word search but lags on the
    # newest (last 14 days, 2026-10-07: 2,506 in Europe PMC vs 3,528 in
    # bioRxiv). A range longer than max_direct_days reads only its last
    # max_direct_days directly (about what max_pages covers); a range ending
    # more than europepmc_lag_days ago is not read directly at all.
    max_direct_days: 21
    europepmc_lag_days: 60

  arxiv:
    enabled: true
    default_selected: false

  openalex:
    enabled: false
    default_selected: false

  crossref:
    enabled: true

  unpaywall:
    enabled: true

  pmc_oa:
    enabled: false

# Your contact email for API polite pools and Unpaywall (required for
# open-access lookup). The environment variable BIORX_CONTACT_EMAIL wins over
# this field when both are set.
#
# Setting BIORX_CONTACT_EMAIL covers all polite-pool consumers (Crossref, arXiv,
# Europe PMC, PubMed, PsyArXiv, SocArXiv, bioRxiv/medRxiv, OpenAlex). It wins
# over this field when both are set; all consumers also read this field directly.
contact_email: ""

# Finding a free full-text copy before summarizing (docs/implementation_plan_2026-09-19_full_text.md).
# Order: the paper's own link, Unpaywall (needs a contact email), OpenAlex,
# Semantic Scholar. With no full text found, the abstract is kept as the entry
# and the model is not called.
full_text:
  # Also search OpenAlex / Semantic Scholar by title when a DOI finds nothing.
  # Title hits must match exactly plus first author or year. Users can turn it
  # off for themselves in Settings.
  find_by_title: true
  # PDFs fetched per paper at most (each can take up to 30 s).
  max_downloads: 4
  # Said once, after where it looked, when one of these hosts refuses a PDF
  # download (HTTP 403/429). bioRxiv and medRxiv refuse every request from
  # Railway, even their home pages; the same PDFs download from a home
  # connection (production check 2026-09-29).
  refused_download_notes:
    www.biorxiv.org: >-
      bioRxiv refuses downloads from some hosting providers, including the one
      this server runs on, so its PDFs cannot be read here. A copy of the app
      running on your own computer can read them.
    www.medrxiv.org: >-
      medRxiv refuses downloads from some hosting providers, including the one
      this server runs on, so its PDFs cannot be read here. A copy of the app
      running on your own computer can read them.
  # Reading one PDF (review B9): it is untrusted, so it is read in a separate
  # process that stops after this many pages or seconds, and (on Linux) may
  # use at most this much memory.
  max_pages: 40
  extract_timeout_seconds: 60
  extract_memory_mb: 1024
  # A publisher page is read up to this many characters when looking for an
  # abstract (review B8). A longer page is cut, and the cut is logged.
  scrape_max_chars: 512000

# OSF preprint servers (PsyArXiv, SocArXiv) are asked for each title term
# separately when every OR group of a filter has one. Above this many distinct
# terms they are searched by date only and the filter is applied here.
osf:
  max_title_terms: 8

# What the web app tells users when a source fails during a search, by the
# failure kind the orchestrator reports. Wording only — edit freely.
failure_explanations:
  unavailable: "did not respond properly — the service may be down or blocking requests; try again later or untick it in Settings"
  error: "failed with an unexpected error (details are in the server log)"
  rate-limited: "is limiting how fast it can be searched; results from it are incomplete — try again in a few minutes"
  partial: "stopped responding part-way; results from it are incomplete"
  truncated: "had more results than the limit (papers read per source) allows; only the first ones were read — raise the limit or narrow the filter"
  page-limit: "has more papers in this date range than one search reads (its page limit), so later papers were not checked — use a shorter date range"

# How many papers a search reads from each source (WS/FL,
# docs/implementation_plan_2026-10-08_limits_and_warnings.md). A saved filter
# can set its own limit; this is the default and the most allowed.
search:
  default_max_results: 200
  max_results_ceiling: 2000
  # "All years" searches from this date (AY3). Every source takes it as an
  # ordinary date range.
  all_years_start: "1900-01-01"

# The line under the results that explains the dates searched (DW4).
date_window:
  hint: "Dates are when a paper first appeared, online or in print, so a source's own date can differ."

# The summary shown when a search could not read every source in full: one
# action per source, chosen by situation, and the most useful next step
# (the first one present, in next_step_order). Wording only — edit freely.
# {total} is the source's total, {limit} the search's limit.
limit_summary:
  next_step_order: [osf_title_word, untick_pubmed, untick_biorxiv, narrow_words, raise_limit, raise_limit_unknown, page_limit, try_later]
  actions:
    untick_pubmed: "Part of Europe PMC — untick it."
    osf_title_word: "No Title word, so every paper in the date range is read. Put a key word in the Title box."
    untick_biorxiv: "Its preprints come through Europe PMC — untick it."
    narrow_words: "Too many to read ({total:,}): narrow the words (add AND …, or use the Title box)."
    raise_limit: "Raise the limit to {total:,} or less, or narrow the words."
    raise_limit_unknown: "Raise the limit, or narrow the words."
    page_limit: "Use a shorter date range; its preprints also come through Europe PMC."
    try_later: "Try again later."
  next_step:
    untick_pubmed: "untick PubMed (it is part of Europe PMC)"
    osf_title_word: "put your main word in the Title box (PsyArXiv and SocArXiv read every paper in the date range without one)"
    untick_biorxiv: "untick bioRxiv / medRxiv (its preprints come through Europe PMC)"
    narrow_words: "narrow the words — add an AND term, or use the Title box"
    raise_limit: "raise the limit (papers read per source)"
    raise_limit_unknown: "raise the limit (papers read per source)"
    page_limit: "use a shorter date range"
    try_later: "try again later"
