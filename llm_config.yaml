# LLM provider configuration.
#
# Model ids and dialects live here, never in Python source (standards L1/L8):
# adding a provider should be a config entry, and a model id that goes stale
# should be a one-line edit rather than a code change.
#
# Dialects:
#   anthropic → x-api-key, /v1/messages, official `anthropic` SDK
#   openai    → Authorization: Bearer, /chat/completions (DeepSeek, OpenAI, …)
#   ollama    → local /api/generate, no key
#
# Setting your API key: use the environment variable named by api_key_env
# (DEEPSEEK_API_KEY, ANTHROPIC_API_KEY), e.g. in .env. Do NOT put a key in this
# file: llm_config.yaml is committed to git, so a key here would be published.
#
# To switch provider: change default_provider to anthropic, deepseek, or ollama.

# DeepSeek: works on this Mac and on the Railway deploy, where there is no
# Ollama. Needs DEEPSEEK_API_KEY: in .env (read by the desktop app and CLI
# agents at start-up) or the host's environment (web deploy).
default_provider: deepseek        # or anthropic, or ollama (local only)

providers:
  ollama:
    dialect: ollama
    base_url: http://localhost:11434
    # The model installed on this Mac (`ollama list`); qwen:7b never was.
    model: qwen3.5:4b
    timeout: 120
    # No api_key_env: a local Ollama needs no credential.

  deepseek:
    dialect: openai
    base_url: https://api.deepseek.com
    # Checked against api-docs.deepseek.com 2026-09-18: deepseek-flash
    # (DeepSeek-V4.1-Flash); deepseek-chat is no longer listed.
    model: deepseek-flash
    model_env: DEEPSEEK_MODEL
    api_key_env: DEEPSEEK_API_KEY
    # deepseek-flash thinks by default at high effort, which adds billed output
    # and time to every summary. Off for summaries (spec O4); set to "enabled"
    # or remove this line if a quality check shows it is needed.
    thinking: disabled
    timeout: 120

  anthropic:
    dialect: anthropic
    # Verified against the current model list, 2026-09-15. `claude-sonnet-4`
    # does not exist; the current ids are claude-opus-5, claude-sonnet-5 and
    # claude-haiku-4-5, with no date suffixes.
    model: claude-sonnet-5             # change to claude-haiku-4-5 for faster/cheaper
    model_env: ANTHROPIC_MODEL
    api_key_env: ANTHROPIC_API_KEY
    timeout: 120

# How much of a paper's extracted text is sent to the model. A budget, named and
# configurable rather than an anonymous slice in the prompt builder, and the
# amount dropped is logged (standards L7, learnings P9).
max_text_chars: 12000

# Estimating what a batch will cost BEFORE running it (plan 2026-09-20 M5).
# Everything here is an estimate shown to the user, never a billing figure.
token_estimate:
  # Characters per token. ~4 for English prose; scientific text with many
  # symbols runs a little denser, which is part of why a range is shown.
  chars_per_token: 4
  # The extracted text of a paper, in characters. The high end is not a guess:
  # max_text_chars above is the hard cap on what is ever sent to the model, so
  # no summary can exceed it. The low end is a short letter or brief report.
  text_chars_low: 3000
  # What the instructions add to every summary prompt, on top of the paper.
  prompt_overhead_tokens: 200
  # What a summary comes back as.
  completion_tokens_low: 150
  completion_tokens_high: 600
  # USD per 1,000,000 tokens, by model. A model with no entry here shows token
  # counts and no dollar figure, rather than a made-up price.
  #
  # These are external prices that go stale. Check them against the provider's
  # pricing page and update the date when you do.
  rates:
    # Anthropic, from the published price list, checked 2026-09-20.
    claude-opus-5:    {input: 5.00,  output: 25.00}
    claude-sonnet-5:  {input: 2.00,  output: 10.00}
    claude-haiku-4-5: {input: 1.00,  output: 5.00}
    # DeepSeek, from api-docs.deepseek.com/quick_start/pricing, checked
    # 2026-09-21. These are the PEAK rates. DeepSeek charges half off-peak
    # (peak is 01:00-04:00 and 06:00-10:00 UTC, Mon-Fri), so an estimate made
    # with these is an upper bound on the price and a run may cost less —
    # which is the direction an estimate should err.
    #
    # Cache-hit input is far cheaper ($0.006/1M peak), but BioRx does not use
    # prompt caching, so the cache-miss rate is the one that applies.
    deepseek-flash:   {input: 0.30,  output: 1.20}
    deepseek-v4-pro:  {input: 1.32,  output: 3.96}

# Summaries billed to the OWNER's key, per user per UTC day. A user on their own
# key is not capped. The access code is shared, so this is the ceiling on what a
# leaked code can spend.
summary_daily_cap_per_user: 25

# Titles that mark a record as a notice about another paper rather than an
# article with content of its own. They usually have no abstract anywhere, and
# a summary of one would be a summary of nothing. Matched case-insensitively
# against the start of the title. A heuristic — editorial content, so it lives
# here rather than in code (repo rule 9).
not_summarizable_title_prefixes:
  - "correction to"
  - "correction:"
  - "erratum"
  - "corrigendum"
  - "retraction"
  - "retraction note"
  - "expression of concern"
  - "publisher correction"
  - "author correction"

# Discover Terms (desktop and web): search broadly with the user's description,
# then ask the model for search terms. The stop words are removed from the
# description before it is searched — editorial content, so it lives here.
discover:
  days_back: 90
  max_papers: 30
  stop_words: [a, an, the, and, or, of, for, in, to, by, on, at, is, are, was,
               were, be, been, being, that, this, with, from, how, what, where,
               which, about, as]
