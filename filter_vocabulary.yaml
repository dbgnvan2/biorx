# Filter vocabulary: the options each filter facet offers, and what they match.
#
# Spec: docs/implementation_plan_2026-09-28_review_fixes.md#S3, #B5
# Read by src/filter_vocabulary.py. The web page builds its dropdowns from this
# file (GET /api/vocabulary), and the search code compares stored ids, never
# display labels, so a label can be reworded here without changing what any
# saved filter means.
#
# Each option: id (stored in the filter), label (shown), and for facets matched
# against a paper, `match`: the record values it accepts.
# `legacy` maps values saved by earlier versions to an id. A legacy value
# mapped to null has no equivalent any more: it is dropped with a warning.
# Every facet has an "any" option meaning "no restriction".

paper_type:
  # Matched against the record's document_type, which the source adapters set
  # to article | review | trial | preprint | other.
  options:
    - {id: any,      label: "(any)"}
    - {id: article,  label: "Research article", match: [article]}
    - {id: review,   label: "Review",           match: [review]}
    - {id: trial,    label: "Clinical trial",   match: [trial]}
    - {id: preprint, label: "Preprint",         match: [preprint]}
  # How a source's own publication types map to document_type. The first rule
  # with a matching word wins; a record matching none is "other". Europe PMC
  # and PubMed send a list (pubTypeList), e.g. ["Review", "Journal Article"].
  source_types:
    - {document_type: preprint, contains: [preprint]}
    - {document_type: review,   contains: [review, meta-analysis]}
    - {document_type: trial,    contains: [clinical trial, controlled trial]}
    - {document_type: article,  contains: [journal article, research-article]}
  legacy:
    "(any)": any
    "review article": review
    # bioRxiv-only article types. No current source reports them.
    "new results": null
    "confirmatory results": null
    "contradictory results": null

version:
  options:
    - {id: any,     label: "(any)"}
    - {id: first,   label: "1 (first submission only)"}
    - {id: revised, label: "2+ (revised only)"}
  legacy:
    "(any)": any
    "1 (first submission only)": first
    "2+ (revised only)": revised

published:
  options:
    - {id: any,      label: "(any)"}
    - {id: preprint, label: "Preprints only (not in a journal)"}
    - {id: journal,  label: "Published in a journal only"}
  legacy:
    "(any)": any
    "preprints only (not in journal)": preprint
    "published in journal only": journal

license:
  # A record's licence string is reduced to one of these ids before matching
  # (src/filter_vocabulary.py license_id). Creative Commons strings and URLs
  # are parsed; the aliases below cover the other spellings sources use.
  options:
    - {id: any,         label: "(any)"}
    - {id: cc-by,       label: "CC BY"}
    - {id: cc-by-sa,    label: "CC BY-SA"}
    - {id: cc-by-nc,    label: "CC BY-NC"}
    - {id: cc-by-nc-sa, label: "CC BY-NC-SA"}
    - {id: cc-by-nd,    label: "CC BY-ND"}
    - {id: cc-by-nc-nd, label: "CC BY-NC-ND"}
    - {id: cc0,         label: "CC0 (public domain dedication)"}
    - {id: pd,          label: "Public domain"}
    - {id: none,        label: "No reuse licence"}
  legacy:
    "(any)": any
    cc_by: cc-by
    cc_by_nc: cc-by-nc
    cc_by_nd: cc-by-nd
    cc_no: none
    pd: pd
  aliases:
    # Record licence strings (lowercased, trimmed) that are not Creative
    # Commons names or URLs.
    "public-domain": pd
    "public domain": pd
    "pd": pd
    "cc_no": none
    "no license": none
    "no licence": none
    "all rights reserved": none

species:
  # Sent to Europe PMC and PubMed as a query clause. "human" and "no-animal"
  # are also checked here against every paper's title (animal_title_terms),
  # so other sources and papers the query flag misses are covered too.
  options:
    - {id: any,       label: "(any)"}
    - {id: human,     label: "Human studies only"}
    - {id: no-animal, label: "Exclude animal studies"}
    - {id: animal,    label: "Animal studies only"}
  legacy:
    "(any)": any
    "Human studies only": human
    "Exclude animal studies": no-animal
    "Animal studies only": animal
  # Europe PMC's ANIMAL:y flag misses many animal studies, so "human" and
  # "no-animal" also exclude these organisms by name.
  excluded_organisms:
    - Mus musculus
    - Rattus norvegicus
    - Mouse
    - Rat
    - Zebrafish
    - Danio rerio
    - Drosophila melanogaster
    - Caenorhabditis elegans
    - Macaca mulatta
  # A title containing one of these (whole words or phrases, any case) marks
  # an animal study for "human" and "no-animal". Titles only: human studies
  # mention animal models in abstracts. "animal" is not checked here: a title
  # without an organism does not show a study is not an animal study.
  # Lab-animal words, plus "<animal> model" phrases for animals whose names
  # have other senses in human research. Those names are left out on their
  # own (QA gate 2026-09-29): "bovine serum albumin", "rabbit monoclonal
  # antibody", "porcine valve", "canine tooth", "murine typhus",
  # "equine-assisted therapy". Pets are left out ("dog ownership"). A word in
  # capitals is read as an acronym (MICE, multiple imputation) and not
  # matched. Missing some livestock/veterinary titles ("Bovine mastitis") is
  # the price of not dropping human studies.
  animal_title_terms:
    - mouse
    - mice
    - rat
    - rats
    - rodent
    - rodents
    - hamster
    - hamsters
    - macaque
    - macaques
    - zebrafish
    - drosophila
    - caenorhabditis
    - c. elegans
    - non-human primate
    - non-human primates
    - nonhuman primate
    - nonhuman primates
    - piglets
    - cattle
    - murine model
    - murine models
    - rabbit model
    - rabbit models
    - porcine model
    - porcine models
    - bovine model
    - bovine models
    - ovine model
    - ovine models
    - canine model
    - canine models
    - equine model
    - equine models
  # An animal word after one of these prefixes names a reagent, not the
  # animal studied: "anti-mouse antibody", "anti rat IgG" (re-gates 2-3,
  # F4/F8). Only these prefixes: "knockout-mouse model" is an animal study.
  animal_title_reagent_prefixes:
    - anti
  # Phrases in which a word above does not mean the animal studied. They are
  # taken out of the title before the check. A hyphen and a space are the
  # same here: "rat tail collagen" also covers "rat-tail collagen".
  animal_title_exceptions:
    - mouse tracking
    - computer mouse
    - mouse ear cress
    - chinese hamster ovary
    - rat race
    - rat bite fever
    - rat lungworm
    # Reagents and preparations (re-gate 3 F7).
    # Both word orders (re-gate 4 F9).
    - mouse human chimeric
    - human mouse chimeric
    - mouse mouse hybridoma
    - rat tail collagen
    - rat liver microsomes
    - rat liver microsomal
    - rat brain homogenate
    - mouse skin extract

category:
  # bioRxiv subject categories, sent to the bioRxiv/medRxiv API as they are.
  # Other sources ignore this facet.
  options:
    - {id: any, label: "(any)"}
    - {id: animal behavior and cognition, label: "animal behavior and cognition"}
    - {id: biochemistry, label: "biochemistry"}
    - {id: bioengineering, label: "bioengineering"}
    - {id: bioinformatics, label: "bioinformatics"}
    - {id: biophysics, label: "biophysics"}
    - {id: cancer biology, label: "cancer biology"}
    - {id: cell biology, label: "cell biology"}
    - {id: clinical trials, label: "clinical trials"}
    - {id: developmental biology, label: "developmental biology"}
    - {id: ecology, label: "ecology"}
    - {id: epidemiology, label: "epidemiology"}
    - {id: evolutionary biology, label: "evolutionary biology"}
    - {id: genetics, label: "genetics"}
    - {id: genomics, label: "genomics"}
    - {id: immunology, label: "immunology"}
    - {id: microbiology, label: "microbiology"}
    - {id: molecular biology, label: "molecular biology"}
    - {id: neuroscience, label: "neuroscience"}
    - {id: paleontology, label: "paleontology"}
    - {id: pathology, label: "pathology"}
    - {id: pharmacology and toxicology, label: "pharmacology and toxicology"}
    - {id: physiology, label: "physiology"}
    - {id: plant biology, label: "plant biology"}
    - {id: scientific communication and education, label: "scientific communication and education"}
    - {id: synthetic biology, label: "synthetic biology"}
    - {id: systems biology, label: "systems biology"}
    - {id: zoology, label: "zoology"}
  legacy:
    "(any)": any
